# Sube docs/ a Hostinger cada vez que se publica algo.
#
# Con esto ya no se mueven zips: haces `node beagentry/publicar.mjs "lo que sea"`,
# eso empuja a GitHub, GitHub Pages se actualiza solo y este flujo copia lo mismo
# a public_html por FTP. Las dos webs quedan iguales sin tocar nada mas.
#
# Hace falta darle las claves UNA vez, en el repositorio:
#   Settings > Secrets and variables > Actions > New repository secret
#     FTP_HOST   el servidor que da Hostinger (hPanel > Archivos > Cuentas FTP)
#     FTP_USER   el usuario de esa cuenta FTP
#     FTP_PASS   su contrasena
#   Opcional, si la web no cuelga de /public_html:
#     FTP_DIR    carpeta destino (por defecto /public_html)
#
# Se puede lanzar a mano desde la pestana Actions con "Run workflow".

name: Publicar en Hostinger

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/hostinger.yml']
  workflow_dispatch:

concurrency:
  group: hostinger
  cancel-in-progress: true

jobs:
  subir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que estan las claves
        env:
          # toJSON(secrets) trae los NOMBRES de lo que ve este repositorio; los
          # valores los tapa GitHub. Sirve para ver si estan mal escritos o si
          # se guardaron en la pestana Variables, que no vale para esto.
          SECRETOS: ${{ toJSON(secrets) }}
          VARIABLES: ${{ toJSON(vars) }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          faltan=""
          [ -z "$FTP_HOST" ] && faltan="$faltan FTP_HOST"
          [ -z "$FTP_USER" ] && faltan="$faltan FTP_USER"
          [ -z "$FTP_PASS" ] && faltan="$faltan FTP_PASS"
          if [ -n "$faltan" ]; then
            echo "Secretos que SI ve este repositorio:"
            python3 -c "import json,os; k=sorted(json.loads(os.environ['SECRETOS'])); print('  ', ', '.join(k) if k else '(ninguno)')"
            echo "Variables (pestana Variables, esto NO sirve para las claves):"
            python3 -c "import json,os; k=sorted(json.loads(os.environ['VARIABLES'])); print('  ', ', '.join(k) if k else '(ninguna)')"
            echo ""
            echo "Se anaden en Settings > Secrets and variables > Actions,"
            echo "pestana Secrets, boton New repository secret. En mayusculas y sin espacios."
            echo "::error::Faltan estos secretos:$faltan"
            exit 1
          fi
          echo "Claves presentes."

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Espejo de docs/ en Hostinger
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR || '/public_html' }}
        run: |
          # --reverse sube en vez de bajar; --delete borra en el servidor lo que
          # ya no esta en docs/, para que no queden restos de versiones viejas.
          # ssl-allow true usa cifrado si Hostinger lo ofrece y sigue sin el si no.
          lftp -c "
            set ftp:ssl-allow true;
            set ftp:ssl-force false;
            set ssl:verify-certificate no;
            set net:timeout 20;
            set net:max-retries 3;
            open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
            mirror --reverse --delete --verbose --parallel=4 \
                   --exclude-glob .nojekyll \
                   docs/ '$FTP_DIR/';
          "

      - name: Resumen
        run: echo "docs/ copiado a Hostinger. Comprueba https://beagentry.com"
