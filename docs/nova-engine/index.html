<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Engine — Level Editor</title>
<link rel="canonical" href="https://beagentry.com/nova-engine/">
<meta name="description" content="Editor 3D en tiempo real con la ergonomia de Unreal Engine 5, corriendo en el navegador: viewport PBR, gizmos, outliner y exportacion.">
<meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f14'/%3E%3Cpath d='M16 4 27 10.5v11L16 28 5 21.5v-11z' fill='none' stroke='%233ba0ff' stroke-width='2'/%3E%3Cpath d='M16 4v24M5 10.5l22 11M27 10.5l-22 11' stroke='%231e6fb8' stroke-width='1'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="./assets/index-BuvyWABw.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DS2U2YFS.css">
  </head>
  <body>
    <div id="app">
      <header id="menubar">
        <div class="brand">
          <svg viewBox="0 0 32 32" width="18" height="18" aria-hidden="true">
            <path d="M16 3 28 10v14L16 31 4 24V10z" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M16 3v28M4 10l24 14M28 10 4 24" stroke="currentColor" stroke-width="1" opacity=".45" />
          </svg>
          <span>Nova&nbsp;Engine</span>
        </div>
        <nav id="menus"></nav>
        <div class="menubar-right">
          <span id="level-name" class="level-name">Untitled&nbsp;Level</span>
          <span id="api-status" class="api-badge" title="Estado de la API de exportacion (localhost:5180)">API…</span>
        </div>
      </header>

      <div id="toolbar"></div>

      <main id="workspace">
        <aside id="left-panel" class="panel">
          <div class="panel-header"><span>Place Actors</span></div>
          <div class="panel-body" id="place-actors"></div>
        </aside>
        <div class="splitter vertical" data-resize="left"></div>

        <section id="center">
          <div id="viewport">
            <canvas id="viewport-canvas"></canvas>
            <div id="viewport-topbar" class="vp-overlay vp-topbar"></div>
            <div id="viewport-stats" class="vp-overlay vp-stats"></div>
            <div id="viewport-hint" class="vp-overlay vp-hint">
              RMB + WASD volar · Alt+LMB orbitar · MMB desplazar · F enfocar · W/E/R gizmo · G vista de juego
            </div>
            <div id="axis-widget" class="vp-overlay vp-axis"></div>
            <div id="toast-stack" class="toast-stack"></div>
          </div>
          <div class="splitter horizontal" data-resize="bottom"></div>
          <div id="bottom-panel" class="panel">
            <div class="panel-header tabs" id="bottom-tabs"></div>
            <div class="panel-body" id="bottom-body"></div>
          </div>
        </section>

        <div class="splitter vertical" data-resize="right"></div>
        <aside id="right-panel">
          <div id="outliner-panel" class="panel">
            <div class="panel-header">
              <span>Outliner</span>
              <input id="outliner-search" class="mini-search" type="search" placeholder="Buscar…" spellcheck="false" />
            </div>
            <div class="panel-body" id="outliner"></div>
          </div>
          <div class="splitter horizontal" data-resize="outliner"></div>
          <div id="details-panel" class="panel">
            <div class="panel-header"><span id="details-title">Details</span></div>
            <div class="panel-body" id="details"></div>
          </div>
        </aside>
      </main>

      <footer id="statusbar">
        <span id="status-message">Listo.</span>
        <span class="spacer"></span>
        <span id="status-selection">Sin seleccion</span>
        <span id="status-fps">— FPS</span>
      </footer>
    </div>

    <div id="modal-root"></div>
    <!-- Beagentry: barra de autoria, la reinyecta tools/publicar-nova.mjs -->
    <style>
      #bea-autor{position:fixed;right:12px;bottom:34px;z-index:9999;display:flex;align-items:center;gap:.7rem;
        font:400 10px/1 Inter,system-ui,"Segoe UI",sans-serif;letter-spacing:.16em;text-transform:uppercase;
        color:#8b95a3;padding:.5rem .8rem;border:1px solid rgba(255,255,255,.12);border-radius:999px;
        background:rgba(10,14,20,.82);backdrop-filter:blur(10px);text-decoration:none;transition:border-color .3s,color .3s}
      #bea-autor:hover{border-color:rgba(255,255,255,.4);color:#e8edf4}
      #bea-autor .p{color:#3ba0ff}
      #bea-autor .p::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
        background:#3ba0ff;margin-right:.45rem;vertical-align:middle;box-shadow:0 0 8px #3ba0ff}
      #bea-autor b{font-weight:600;color:#e8edf4;letter-spacing:.1em}
      #bea-autor .sep{width:1px;height:11px;background:rgba(255,255,255,.15)}
      @media(max-width:820px){#bea-autor .largo{display:none}}
    </style>
    <a id="bea-autor" href="../" title="Beagentry">
      <span class="p">Prueba</span><span class="sep"></span>
      <span><span class="largo">Editor 3D en el navegador, </span>hecho por <b>Beagentry</b></span>
    </a>
  </body>
</html>
