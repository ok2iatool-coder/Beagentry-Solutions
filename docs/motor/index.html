<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Rhône 9C — 103 piezas escritas a mano</title>
<link rel="canonical" href="https://beagentry.com/motor/">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="description" content="Motor rotativo Le Rhône 9C de 1917, modelado pieza a pieza por código. 103 piezas, ninguna tocada con el ratón.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080a;--tinta:#eceae5;--suave:#807b74;--muy:#35332f;--linea:rgba(255,255,255,.09);--ac:#d8a24a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tinta);font-family:Inter,system-ui,"Segoe UI",sans-serif;font-weight:300;overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:0}
a{color:inherit;text-decoration:none}
.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--suave)}

/* marca y autoria */
#marca{position:fixed;left:1.6rem;top:1.3rem;z-index:3}
#marca b{display:block;font-weight:200;font-size:1.15rem;letter-spacing:-.01em;margin-top:.35rem}
#autor{position:fixed;right:1.6rem;top:1.2rem;z-index:3;display:flex;align-items:center;gap:.9rem;
  font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--suave);
  padding:.55rem .9rem;border:1px solid var(--linea);border-radius:999px;
  background:rgba(8,8,10,.55);backdrop-filter:blur(10px);transition:border-color .3s,color .3s}
#autor:hover{border-color:rgba(255,255,255,.35);color:var(--tinta)}
#autor .p{color:var(--ac)}
#autor .p::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ac);margin-right:.5rem;vertical-align:middle;box-shadow:0 0 8px var(--ac)}
#autor b{font-weight:500;color:var(--tinta);letter-spacing:.1em}
#autor .sep{width:1px;height:12px;background:var(--linea)}

/* ficha */
#ficha{position:fixed;left:1.6rem;bottom:1.6rem;z-index:3;display:flex;flex-direction:column;gap:.55rem}
#ficha .d{display:flex;gap:.7rem;align-items:baseline}
#ficha .d b{font-weight:200;font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums}
#ficha .d span{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--suave)}

/* control */
#control{position:fixed;left:50%;bottom:1.7rem;transform:translateX(-50%);z-index:3;
  display:flex;align-items:center;gap:1rem;padding:.7rem 1.2rem;border:1px solid var(--linea);
  border-radius:999px;background:rgba(8,8,10,.6);backdrop-filter:blur(12px);white-space:nowrap}
#control label{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--suave)}
#sl{-webkit-appearance:none;appearance:none;width:min(38vw,260px);height:2px;background:var(--muy);border-radius:2px;outline:0;cursor:pointer}
#sl::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--tinta);cursor:grab;transition:transform .2s}
#sl::-webkit-slider-thumb:hover{transform:scale(1.25)}
#sl::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--tinta);cursor:grab}
#auto{background:transparent;border:1px solid var(--linea);color:var(--suave);border-radius:999px;
  padding:.35rem .8rem;font:inherit;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:all .3s}
#auto:hover{border-color:rgba(255,255,255,.4);color:var(--tinta)}
#auto.on{background:var(--tinta);color:#000;border-color:var(--tinta)}

/* pieza señalada */
#pieza{position:fixed;z-index:4;pointer-events:none;font-family:"JetBrains Mono",monospace;font-size:.66rem;
  letter-spacing:.1em;padding:.3rem .55rem;border:1px solid var(--linea);border-radius:5px;
  background:rgba(8,8,10,.85);opacity:0;transition:opacity .2s;transform:translate(12px,-50%)}
#pieza.on{opacity:1}

/* pista */
#pista{position:fixed;right:1.6rem;bottom:1.7rem;z-index:3;text-align:right;line-height:2}
@media(max-width:820px){
  #ficha,#pista{display:none}
  #autor{right:1rem;top:1rem;font-size:.55rem;gap:.55rem;padding:.45rem .7rem}
  #autor .largo{display:none}
  #control{gap:.7rem;padding:.6rem .9rem;bottom:1.2rem}
}

/* carga */
#carga{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1.3rem;transition:opacity .9s}
#carga.fuera{opacity:0;pointer-events:none}
#carga .t{font-weight:200;font-size:clamp(1.6rem,4vw,2.6rem);letter-spacing:-.02em}
#carga .b{width:min(240px,50vw);height:1px;background:var(--muy);overflow:hidden}
#carga .b i{display:block;height:100%;width:0;background:var(--ac);transition:width .25s}
</style>
</head>
<body>

<div id="marca"><span class="mono">Beagentry · Taller</span><b>Le Rhône 9C</b></div>

<a id="autor" href="../" title="Beagentry">
  <span class="p">Taller</span><span class="sep"></span>
  <span><span class="largo">Del modelo a la animación, </span>hecho por <b>Beagentry</b></span>
</a>

<div id="ficha">
  <div class="d"><b id="n-piezas">103</b><span>piezas</span></div>
  <div class="d"><b>1917</b><span>rotativo · 9 cilindros</span></div>
  <div class="d"><b>0</b><span>tocadas con el ratón</span></div>
</div>

<div id="control">
  <label for="sl">Despiece</label>
  <input id="sl" type="range" min="0" max="100" value="0">
  <button id="auto" class="on" type="button">Auto</button>
</div>

<div id="pista" class="mono">Arrastra para girar<br>Rueda para acercar</div>
<div id="pieza"></div>

<div id="carga">
  <div class="t">Le Rhône 9C</div>
  <div class="b"><i></i></div>
  <div class="mono" id="carga-n">0%</div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const lienzo = document.createElement('canvas');
document.body.appendChild(lienzo);

const rend = new THREE.WebGLRenderer({ canvas: lienzo, antialias: true });
rend.setPixelRatio(Math.min(devicePixelRatio, 2));
rend.toneMapping = THREE.ACESFilmicToneMapping;
rend.toneMappingExposure = 1.15;
rend.shadowMap.enabled = true;
rend.shadowMap.type = THREE.PCFSoftShadowMap;

const escena = new THREE.Scene();
escena.background = new THREE.Color(0x08080a);

// Entorno de estudio: sin el, el metal sale plano porque no tiene nada que reflejar.
const pmrem = new THREE.PMREMGenerator(rend);
escena.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const cam = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.01, 100);

const key = new THREE.DirectionalLight(0xfff2dd, 2.6);
key.position.set(3, 4, 2.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0012;
escena.add(key, new THREE.AmbientLight(0xffffff, 0.18));
const rim = new THREE.DirectionalLight(0x88aaff, 1.1);
rim.position.set(-3, 1.4, -3);
escena.add(rim);

const suelo = new THREE.Mesh(
  new THREE.CircleGeometry(6, 64).rotateX(-Math.PI / 2),
  new THREE.ShadowMaterial({ opacity: 0.5 })
);
escena.add(suelo);

// ------------------------------------------------------------ orbita propia
// No hay OrbitControls en vendor/, y hacen falta cuatro cosas: girar, acercar,
// amortiguar y girar solo cuando nadie toca. Sale mas corto escribirlo.
const orb = { az: 0.7, pol: 1.15, dist: 1, objetivo: new THREE.Vector3() };
const meta = { az: orb.az, pol: orb.pol, dist: 1 };
let arrastrando = false, ultimo = null, autogiro = true, quieto = 0;

lienzo.addEventListener('pointerdown', (e) => {
  arrastrando = true; ultimo = { x: e.clientX, y: e.clientY };
  lienzo.setPointerCapture(e.pointerId);
});
lienzo.addEventListener('pointermove', (e) => {
  senyalar(e);
  if (!arrastrando) return;
  meta.az -= (e.clientX - ultimo.x) * 0.006;
  meta.pol = Math.min(Math.PI - 0.15, Math.max(0.15, meta.pol - (e.clientY - ultimo.y) * 0.006));
  ultimo = { x: e.clientX, y: e.clientY };
  quieto = 0;
});
addEventListener('pointerup', () => { arrastrando = false; });
lienzo.addEventListener('wheel', (e) => {
  e.preventDefault();
  meta.dist = Math.min(3.2, Math.max(0.45, meta.dist * (1 + Math.sign(e.deltaY) * 0.12)));
}, { passive: false });

// ------------------------------------------------------------ modelo

const sl = document.getElementById('sl');
const botonAuto = document.getElementById('auto');
const carga = document.getElementById('carga');
const barra = carga.querySelector('.b i');
const cargaN = document.getElementById('carga-n');
const etiqueta = document.getElementById('pieza');

let piezas = [];
let radio = 1;
let t = 0;          // 0 montado, 1 despiezado
let tMeta = 0;
let auto = true;
let reloj = 0;

new GLTFLoader().load('assets/lerhone9c.glb',
  (glb) => {
    const raiz = glb.scene;

    const caja = new THREE.Box3().setFromObject(raiz);
    const centro = caja.getCenter(new THREE.Vector3());
    const tam = caja.getSize(new THREE.Vector3());
    radio = Math.max(tam.x, tam.y, tam.z) / 2;

    // Centrar en el origen y dejar el motor de pie sobre el suelo
    raiz.position.sub(centro);
    raiz.position.y += tam.y / 2;
    escena.add(raiz);
    suelo.position.y = 0;
    orb.objetivo.set(0, tam.y / 2, 0);

    // Direccion de despiece: cada pieza se aleja del eje del motor. En un
    // rotativo de nueve cilindros eso abre la estrella, que es justo la gracia.
    const c = new THREE.Vector3(0, tam.y / 2, 0);
    raiz.traverse((o) => {
      if (!o.isMesh) return;
      o.castShadow = o.receiveShadow = true;
      const b = new THREE.Box3().setFromObject(o);
      const p = b.getCenter(new THREE.Vector3());
      const d = p.sub(c);
      if (d.lengthSq() < 1e-8) d.set(0, 0, 0); else d.normalize();
      piezas.push({ o, base: o.position.clone(), dir: d, nombre: o.name || 'pieza' });
    });

    document.getElementById('n-piezas').textContent = piezas.length;
    meta.dist = 1;
    encuadrar();
    carga.classList.add('fuera');
    setTimeout(() => carga.remove(), 1000);
  },
  (e) => {
    if (!e.lengthComputable) return;
    const p = Math.round((e.loaded / e.total) * 100);
    barra.style.width = p + '%';
    cargaN.textContent = p + '%';
  },
  () => { cargaN.textContent = 'no se pudo cargar el modelo'; }
);

function encuadrar() {
  const d = radio / Math.tan((cam.fov * Math.PI / 180) / 2) * 1.5;
  orb.dist = d; meta.dist = 1; orb.escala = d;
}

// ------------------------------------------------------------ mandos

sl.addEventListener('input', () => { tMeta = sl.value / 100; ponerAuto(false); });
botonAuto.addEventListener('click', () => ponerAuto(!auto));
function ponerAuto(v) {
  auto = v;
  botonAuto.classList.toggle('on', v);
  if (v) reloj = 0;
}

// Señalar la pieza bajo el raton: los nombres son los del script que la creo
const rayo = new THREE.Raycaster();
const raton = new THREE.Vector2();
let ultimaPieza = null;
function senyalar(e) {
  if (!piezas.length || arrastrando) { etiqueta.classList.remove('on'); return; }
  raton.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  rayo.setFromCamera(raton, cam);
  const golpe = rayo.intersectObjects(piezas.map((p) => p.o), false)[0];
  if (!golpe) {
    etiqueta.classList.remove('on');
    if (ultimaPieza) { ultimaPieza.material.emissive?.setHex(ultimaPieza.userData.emi ?? 0); ultimaPieza = null; }
    return;
  }
  etiqueta.textContent = golpe.object.name || 'pieza';
  etiqueta.style.left = e.clientX + 'px';
  etiqueta.style.top = e.clientY + 'px';
  etiqueta.classList.add('on');
}

// ------------------------------------------------------------ bucle

let prev = performance.now();
function pinta(ahora) {
  requestAnimationFrame(pinta);
  const dt = Math.min(0.05, (ahora - prev) / 1000); prev = ahora;

  // Ciclo automatico: montado, se abre, aguanta, se cierra.
  if (auto && piezas.length) {
    reloj += dt;
    const C = 11;                       // segundos por vuelta completa
    const f = (reloj % C) / C;
    tMeta = f < 0.10 ? 0
      : f < 0.35 ? suave((f - 0.10) / 0.25)
      : f < 0.65 ? 1
      : f < 0.90 ? 1 - suave((f - 0.65) / 0.25)
      : 0;
    sl.value = Math.round(tMeta * 100);
  }

  t += (tMeta - t) * Math.min(1, dt * 6);
  for (const p of piezas) p.o.position.copy(p.base).addScaledVector(p.dir, t * radio * 0.9);

  if (!arrastrando) { quieto += dt; if (quieto > 1.5) meta.az += dt * 0.16; }

  orb.az += (meta.az - orb.az) * Math.min(1, dt * 5);
  orb.pol += (meta.pol - orb.pol) * Math.min(1, dt * 5);
  const dist = (orb.escala || 1) * meta.dist * (1 + t * 0.95);   // al abrirse, la camara retrocede lo justo para que no se salga
  orb.dist += (dist - orb.dist) * Math.min(1, dt * 4);

  cam.position.set(
    orb.objetivo.x + orb.dist * Math.sin(orb.pol) * Math.sin(orb.az),
    orb.objetivo.y + orb.dist * Math.cos(orb.pol),
    orb.objetivo.z + orb.dist * Math.sin(orb.pol) * Math.cos(orb.az)
  );
  cam.lookAt(orb.objetivo);
  rend.render(escena, cam);
}
const suave = (x) => x * x * (3 - 2 * x);
requestAnimationFrame(pinta);

function medir() {
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
  rend.setSize(innerWidth, innerHeight, false);
}
addEventListener('resize', medir);
medir();
</script>
</body>
</html>
